<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <title>Lamha Translate Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 340px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
    }
    .badge {
      background: linear-gradient(135deg, #e11d48, #991b1b);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, input[type="range"] {
      width: 100%;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      outline: none;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 12.5px;
    }
    .status-note {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="badge">ع</div>
      <span>Lamha Translate</span>
    </div>
    <input type="checkbox" id="isEnabled" checked />
  </div>

  <div class="field">
    <label for="targetLanguage">Default Target Language:</label>
    <select id="targetLanguage">
      <option value="ar">🇸🇦 Arabic (العربية)</option>
      <option value="en">🇺🇸 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="tr">🇹🇷 Türkçe</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="zh-CN">🇨🇳 中文 (Chinese)</option>
      <option value="ja">🇯🇵 日本語 (Japanese)</option>
    </select>
  </div>

  <div class="toggle-row">
    <span>Smart Reverse Translation</span>
    <input type="checkbox" id="smartReverseTranslation" checked />
  </div>

  <div class="field">
    <label for="secondaryLanguage">Secondary Target Language:</label>
    <select id="secondaryLanguage">
      <option value="en">🇺🇸 English</option>
      <option value="ar">🇸🇦 Arabic (العربية)</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
    </select>
  </div>

  <div class="field">
    <label for="triggerMode">Selection Trigger Mode:</label>
    <select id="triggerMode">
      <option value="icon_click">Show mini icon (Click to translate)</option>
      <option value="icon_hover">Show mini icon (Hover to translate)</option>
      <option value="instant">Instant translation on selection</option>
    </select>
  </div>

  <div class="field">
    <label for="fontSize">Translation Font Size: <span id="fontSizeVal">15</span>px</label>
    <input type="range" id="fontSize" min="12" max="22" step="1" value="15" />
  </div>

  <div class="status-note">All settings save automatically • MIT License</div>
  <script src="popup.js"></script>
</body>
</html>
